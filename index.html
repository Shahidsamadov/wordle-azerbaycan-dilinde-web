<!DOCTYPE html>
<!--
  WordleAZ - Wordle in the Azerbaijani language
  https://wordleaz.synetrix.in/

  This page is the complete shell: all global CSS lives in the <style> block
  below and all behaviour lives in main.js.  There is no build step.

  Structure of the document
  -------------------------
    <head>   meta tags, Open Graph / Twitter cards, PWA manifest, global CSS
    <body>   <game-app> (a custom element defined by main.js) + the consent bar

  Notes for maintainers
  ---------------------
    * Open Graph and Twitter card images MUST be absolute URLs - crawlers do not
      resolve relative paths, so a relative one silently yields no preview.
    * The Google Analytics tag is loaded with Consent Mode v2 and starts in the
      "denied" state; analytics storage is only granted after the visitor
      accepts the consent bar.
    * The game deliberately never sends the daily answer to analytics.
-->
<html lang="az" translate="yes">
  <head>
    <meta charset="UTF-8" />
    <!--
      `user-scalable=no` used to be set here, which blocks pinch-zoom and fails
      WCAG 1.4.4.  Zoom is left enabled on purpose.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wordle🇦🇿 Azərbaycan dilində</title>
    <meta name="description" content="Wordle Azərbaycan dilində - 6 cəhddə gizli sözü tapın. Hər gün yeni bir söz!"/>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://wordleaz.synetrix.in/" />

    <!-- Open Graph (Facebook, Telegram, WhatsApp, ...) -->
    <meta property="og:url" content="https://wordleaz.synetrix.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wordle🇦🇿 Azərbaycan dilində" />
    <meta property="og:locale" content="az_AZ" />
    <meta property="og:title" content="Wordle Azərbaycan dilində - Gündəlik Söz Oyunu" />
    <meta property="og:description" content="Wordle Azərbaycan dilində - 6 cəhddə gizli sözü tapın. Hər gün yeni bir söz!" />
    <!-- Absolute URL: a relative path is ignored by every crawler. -->
    <meta property="og:image" content="https://wordleaz.synetrix.in/images/wordleaz_1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wordle Azərbaycan dilində" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wordle Azərbaycan dilində - Gündəlik Söz Oyunu" />
    <meta name="twitter:description" content="Wordle Azərbaycan dilində - 6 cəhddə gizli sözü tapın. Hər gün yeni bir söz!" />
    <meta name="twitter:image" content="https://wordleaz.synetrix.in/images/wordleaz_1200x630.png" />

    <meta name="theme-color" content="#6aaa64" />

    <!-- Progressive web app -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WordleAZ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" sizes="32x32" href="images/wordleaz_logo_32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/wordleaz_logo_180x180.png" />

    <style>
      /* Global Styles & Colors */
      :root {
        --green: #6aaa64;
        --darkendGreen: #538d4e;
        --yellow: #c9b458;
        --darkendYellow: #b59f3b;
        --lightGray: #d8d8d8;
        --gray: #86888a;
        --darkGray: #939598;
        --white: #fff;
        --black: #212121;
        /* Colorblind colors */
        --orange: #f5793a;
        --blue: #85c0f9;
        font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        --header-height: 50px;
        --keyboard-height: 200px;
        --game-max-width: 500px;
      }
      /* Light theme colors */
      :root {
        --color-tone-1: #1a1a1b;
        --color-tone-2: #787c7e;
        --color-tone-3: #878a8c;
        --color-tone-4: #d3d6da;
        --color-tone-5: #edeff1;
        --color-tone-6: #f6f7f8;
        --color-tone-7: #ffffff;
        --opacity-50: rgba(255, 255, 255, 0.5);
      }
      /* Dark Theme Colors */
      .nightmode {
        --color-tone-1: #d7dadc;
        --color-tone-2: #818384;
        --color-tone-3: #565758;
        --color-tone-4: #3a3a3c;
        --color-tone-5: #272729;
        --color-tone-6: #1a1a1b;
        --color-tone-7: #121213;
        --opacity-50: rgba(0, 0, 0, 0.5);
      }
      /* Constant colors and colors derived from theme */
      :root,
      .nightmode {
        --color-background: var(--color-tone-7);
      }
      :root {
        --color-present: var(--yellow);
        --color-correct: var(--green);
        --color-absent: var(--color-tone-2);
        --tile-text-color: var(--color-tone-7);
        --key-text-color: var(--color-tone-1);
        --key-evaluated-text-color: var(--color-tone-7);
        --key-bg: var(--color-tone-4);
        --key-bg-present: var(--color-present);
        --key-bg-correct: var(--color-correct);
        --key-bg-absent: var(--color-absent);
        --modal-content-bg: var(--color-tone-7);
      }
      .nightmode {
        --color-present: var(--darkendYellow);
        --color-correct: var(--darkendGreen);
        --color-absent: var(--color-tone-4);
        --tile-text-color: var(--color-tone-1);
        --key-text-color: var(--color-tone-1);
        --key-evaluated-text-color: var(--color-tone-1);
        --key-bg: var(--color-tone-2);
        --key-bg-present: var(--color-present);
        --key-bg-correct: var(--color-correct);
        --key-bg-absent: var(--color-absent);
        --modal-content-bg: var(--color-tone-7);
      }
      .colorblind {
        --color-correct: var(--orange);
        --color-present: var(--blue);
        --tile-text-color: var(--white);
        --key-bg-present: var(--color-present);
        --key-bg-correct: var(--color-correct);
        --key-bg-absent: var(--color-absent);
      }
      html {
        height: 100%;
      }
      body {
        height: 100%;
        background-color: var(--color-background);
        margin: 0;
        padding: 0;
        /* Prevent scrollbar appearing on page transition */
        overflow-y: hidden;
      }

      /* ---- Analytics consent bar --------------------------------------
         A one-line strip pinned to the bottom of the viewport.  It stays
         hidden until consent.js decides that the visitor has not answered yet,
         so a failed script means "no banner" rather than a broken layout.
         The :not([hidden]) selector is used because a plain `display: flex`
         would override the `hidden` attribute. */
      #consent-bar {
        display: none;
      }
      #consent-bar:not([hidden]) {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: center;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        padding: 10px 16px;
        background-color: var(--color-tone-1);
        color: var(--color-tone-7);
        font-size: 13px;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.25);
      }
      #consent-bar .consent-actions {
        display: flex;
        gap: 8px;
      }
      #consent-bar button {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
      }
      #consent-bar #consent-accept {
        background-color: var(--green);
        border-color: var(--green);
        color: var(--white);
      }
    </style>
    <!--
      Google Analytics 4 with Consent Mode v2.

      The consent state defaults to "denied", so GA4 is loaded but stores no
      analytics cookies and sends no events until the visitor opts in through
      the banner at the bottom of the page.  `wait_for_update` gives the banner
      500 ms to restore a previously saved decision from localStorage, which
      avoids losing the first pageview for returning visitors.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2B65CDBVB2"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-2B65CDBVB2', {
        // No advertising features are used, and the daily answer is never sent.
        anonymize_ip: true
      });
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 16px; font-family: sans-serif; text-align: center;">
        Wordle🇦🇿 oynamaq üçün JavaScript-i aktivləşdirməlisiniz.
      </p>
    </noscript>

    <!--
      Cookie / analytics consent bar.

      It is plain DOM (no framework) and decides on its own whether to appear:
      the stored answer is read first, and the element is only built when the
      visitor has not decided yet.  "Analitikaya icazə ver" grants analytics
      storage, "İmtina et" keeps it denied; both remove the bar.
    -->
    <div id="consent-bar" hidden>
      <span>Bu sayt oyunu yaxşılaşdırmaq üçün anonim statistikadan istifadə edir.</span>
      <span class="consent-actions">
        <button type="button" id="consent-decline">İmtina et</button>
        <button type="button" id="consent-accept">İcazə ver</button>
      </span>
    </div>

    <!--
      The game itself.  `defer` lets the browser keep parsing the page while
      main.js downloads; the element is upgraded automatically as soon as the
      custom elements are defined.
    -->
    <script src="main.js" defer></script>
    <game-app></game-app>

    <script src="consent.js" defer></script>
    <script>
      // Register the service worker for offline play and installability.
      // It is skipped on file:// URLs, where service workers are not allowed.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (error) {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
